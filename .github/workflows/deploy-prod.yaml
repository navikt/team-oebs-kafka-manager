name: Build, push and deploy til prod-fss
on: 
  push:
    paths:
      - 'kafka/team-oebs-kafka-manager-prod.yaml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@1de80da70ad26556ecdc5964a8b7ec3bbed98120
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: prod-fss
          RESOURCE: kafka/team-oebs-kafka-manager-prod.yaml
