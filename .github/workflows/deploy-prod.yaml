name: Build, push and deploy til prod-fss
on: 
  push:
    paths:
      - 'kafka/team-oebs-kafka-manager-prod.yaml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: prod-fss
          RESOURCE: kafka/team-oebs-kafka-manager-prod.yaml
