name: Build, push and deploy til dev-fss
on: 
  push:
    paths:
      - 'kafka/team-oebs-kafka-manager-t1.yaml'
      - 'kafka/team-oebs-kafka-manager-q1.yaml'
      - 'kafka/team-oebs-kafka-manager-u1.yaml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: dev-fss
          RESOURCE: kafka/team-oebs-kafka-manager-t1.yaml

  deploy-q1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: dev-fss
          RESOURCE: kafka/team-oebs-kafka-manager-q1.yaml

  deploy-u1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        if: github.ref == 'refs/heads/main'
        env:
          CLUSTER: dev-fss
          RESOURCE: kafka/team-oebs-kafka-manager-u1.yaml
